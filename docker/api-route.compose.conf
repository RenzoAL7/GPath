# Local-only Docker DNS; the Kubernetes ingress routes to the API directly.
location /api {
    set $gpath_cache_control "no-store";
    proxy_hide_header Cache-Control;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gpath_api http://api:8081;
    proxy_pass $gpath_api;
    proxy_connect_timeout 2s;
    proxy_read_timeout 6s;
    proxy_set_header Host $host;
}
