name: GPath delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/renzoal7/gitpath
  API_IMAGE: ghcr.io/renzoal7/gitpath-api
  # These remain two image names. Each name is a manifest that lets the
  # registry choose amd64 or arm64 for the machine that pulls it.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  validate:
    name: Test API and interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Build once with traceable metadata
        env:
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_DIRTY: 'false'
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the exact tested metadata for both containers
        uses: actions/upload-artifact@v4
        with:
          name: gpath-release
          path: public/release.json
          if-no-files-found: error
          retention-days: 30
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/
            test-results/
          retention-days: 7

  smoke:
    name: Test both runtime containers
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: gpath-release
          path: public
      - run: docker compose up --build -d --wait --wait-timeout 60
      - run: node scripts/smoke.mjs
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail 60
      - name: Stop test containers
        if: always()
        run: docker compose down

  package-web:
    name: Package web image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpath-release
          path: public
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the existing registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build one multi-platform web image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RenzoAL7/GPath
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true

  package-api:
    name: Package API image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpath-release
          path: public
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the existing registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build one multi-platform API image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RenzoAL7/GPath
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true

  update-gitops:
    name: Propose a reviewed GitOps promotion
    needs: [package-web, package-api]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: RenzoAL7/K3s-Cortex
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
      - name: Pin BOTH published digests and activate the new overlay together
        env:
          WEB_DIGEST: ${{ needs.package-web.outputs.digest }}
          API_DIGEST: ${{ needs.package-api.outputs.digest }}
        run: |
          node scripts/promote.mjs cortex "$WEB_DIGEST" "$API_DIGEST"
          git -C cortex diff --check
      - name: Render the desired state without contacting the cluster
        run: kubectl kustomize cortex/apps/gpath/overlays/growth > /dev/null
      - name: Open or update promotion PR; no automatic merge
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
          add-paths: |
            apps/gpath/overlays/growth/kustomization.yaml
            clusters/rnz-prod/gpath-application.yaml
          branch: automation/gpath-prod
          delete-branch: true
          base: main
          commit-message: 'chore(gpath): promote ${{ github.sha }}'
          title: 'chore(gpath): promote web + API ${{ github.sha }}'
          body: |
            Both images were built after unit, browser and container tests passed.

            - Source: https://github.com/RenzoAL7/GPath/commit/${{ github.sha }}
            - Workflow: https://github.com/RenzoAL7/GPath/actions/runs/${{ github.run_id }}
            - Web: `${{ env.WEB_IMAGE }}@${{ needs.package-web.outputs.digest }}`
            - API: `${{ env.API_IMAGE }}@${{ needs.package-api.outputs.digest }}`

            Review both image pins, registry access and ingress routing before merging.
            The first promotion also switches gpath-prod to the growth overlay.
            Argo CD reconciles after merge; this build does not assert deployment success.
            Rollback: revert this promotion commit in K3s-Cortex.
