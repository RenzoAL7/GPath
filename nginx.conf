server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    set $gpath_cache_control "no-cache";

    add_header Cache-Control $gpath_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Kubernetes routes /api directly to the API Service. Compose replaces
    # this include with its local reverse proxy, without changing the image.
    include /etc/nginx/api-route.conf;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /release.json {
        set $gpath_cache_control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        set $gpath_cache_control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
